# TreePrep status page, powered by Upptime. Setup steps: docs/SETUP.md
# Docs for every key: https://upptime.js.org/docs/configuration

owner: TreePrep # GitHub organization that owns this repository
repo: treeprep-status # name of this repository

# Repository secrets that the checks may read (see docs/SETUP.md). GH_PAT is passed separately by the
# generated workflows and is not listed. This is the complete allowlist: if you add notifications later,
# add their NOTIFICATION_* secrets here too.
secrets:
  - TREEPREP_SITE_URL # the website, e.g. https://treeprep.com/
  - TREEPREP_HEALTH_URL # the API health endpoint, e.g. https://treeprep.com/api/health

# The URLs live in secrets so that moving from staging to production is a secret change only.
# Body rules look for plain text in the response (headers included). Upptime marks a check "down" or "degraded"
# when the text is missing, and retries twice (after 2 s and 10 s) before it records that.
#
# The three health checks read the same endpoint. `sandbox.ready` and `ai` in its answer report whether the
# code runner URL and the AI key are configured; they do not call the runner or the AI provider, so these two
# checks catch missing configuration after a deploy, not an outage of the runner or of the AI provider.
sites:
  - name: Website
    slug: website
    url: $TREEPREP_SITE_URL
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    maxResponseTime: 5000 # ms; slower than this counts as degraded
    # The site is a single-page app: Firebase answers unknown paths with the same index.html and a 200, so a
    # status code alone proves little. This element exists only in the real app shell.
    __dangerous__body_down_if_text_missing: '<div id="root"></div>'

  - name: API
    slug: api
    url: $TREEPREP_HEALTH_URL
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000 # ms; allows for a cold start of the API
    # {"ok":true,...} is returned whenever the API process is up.
    __dangerous__body_down_if_text_missing: '"ok":true'

  - name: Code runner
    slug: code-runner
    url: $TREEPREP_HEALTH_URL
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000
    # Without a runner, Run and Submit fail for everyone, so a missing "ready":true is "down", not "degraded".
    __dangerous__body_down_if_text_missing: '"ready":true'

  - name: AI feedback
    slug: ai-feedback
    url: $TREEPREP_HEALTH_URL
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000
    # Practice still works without AI feedback, so a missing "ai":true is "degraded", not "down".
    __dangerous__body_degraded_if_text_missing: '"ai":true'

status-website:
  cname: status.treeprep.com
  name: TreePrep Status # browser tab title; the header shows the TreePrep wordmark (assets/treeprep.css)
  logoUrl: /treeprep-icon.svg
  logoHref: https://treeprep.com
  favicon: /icon-192.png
  faviconSvg: /treeprep-icon-small.svg
  themeUrl: /treeprep.css # colours and fonts, see the comments in that file
  # NOTE: this page monitors STAGING for now (the URLs in the secrets above). Before switching the secrets to
  # production (docs/SETUP.md, "Moving to production") remove the noindex tag below and update this text.
  introTitle: Live status of TreePrep.
  introMessage: We check the website, the API, the code runner and AI feedback around the clock. If something breaks, it is listed here as an incident until it is fixed.
  metaTags:
    - name: robots
      content: noindex
  navbar:
    - title: Status
      href: /
    - title: TreePrep
      href: https://treeprep.com
