# TreePrep status page, powered by Upptime.
# Docs for every key: https://upptime.js.org/docs/configuration

owner: TreePrep # GitHub organization that owns this repository
repo: treeprep-status # name of this repository

# Repository secrets that the checks may read. GH_PAT is passed separately by the
# generated workflows and is not listed. This is the complete allowlist: if you add notifications later,
# add their NOTIFICATION_* secrets here too.
secrets:
  - TREEPREP_HOST # bare hostname of the website, no scheme or path, e.g. treeprep.com
  - TREEPREP_API_HOST # bare hostname of the API, no scheme or path, e.g. api.treeprep.com

# Only the hostnames live in secrets, so moving from staging to production is a secret change only. GitHub masks
# a secret's exact value in workflow logs, and when a check fails to connect curl prints just the host, so a
# host-only secret is what gets masked. (A full-URL secret would not match that error text.)
# Body rules look for text in the response (headers included) and mark a check "down" or "degraded" when it is
# missing (or, for `body_degraded`, present). A check that is not up is retried twice (after 2 s and 10 s) before
# it is recorded.
#
# The three health checks read the same endpoint. `sandbox.ready` and `ai` in its answer report whether the
# code runner URL and the AI key are configured; they do not call the runner or the AI provider, so these two
# checks catch missing configuration after a deploy, not an outage of the runner or of the AI provider.
sites:
  - name: Website
    slug: website
    url: https://$TREEPREP_HOST/
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    maxResponseTime: 5000 # ms; slower than this counts as degraded
    # The site is a single-page app: Firebase answers unknown paths with the same index.html and a 200, so a
    # status code alone proves little. This id exists only in the real app shell.
    __dangerous__body_down_if_text_missing: 'id="root"'

  - name: API
    slug: api
    url: https://$TREEPREP_API_HOST/api/health
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000 # ms; allows for a cold start of the API
    # {"ok":true,...} is returned whenever the API process is up.
    __dangerous__body_down_if_text_missing: '"ok":true'

  - name: Code runner
    slug: code-runner
    url: https://$TREEPREP_API_HOST/api/health
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000
    # Without a runner, Run and Submit fail for everyone, so a missing "ready":true is "down", not "degraded".
    # The pattern ties "ready":true to the "sandbox" object, so another "ready" key elsewhere cannot keep it green.
    # It is a JavaScript regular expression without flags (single-quoted YAML keeps the backslash as is).
    __dangerous__body_down_if_regex_missing: '"sandbox":\{[^}]*"ready":true'

  - name: AI feedback
    slug: ai-feedback
    url: https://$TREEPREP_API_HOST/api/health
    icon: https://status.treeprep.com/treeprep-icon-small.svg
    expectedStatusCodes:
      - 200
    maxResponseTime: 8000
    # Practice still works without AI feedback, so this is "degraded", not "down". The API answers "ai":false when
    # the key is not set. This presence rule only applies when the HTTP status was expected, so a full outage
    # (unreachable or 5xx) stays "down" instead of being masked as "degraded".
    __dangerous__body_degraded: '"ai":false'

# The public page is our own static site in site/, deployed by .github/workflows/pages.yml (see README). Upptime's
# own Svelte site build is switched off, so Static Site CI has nothing to build (see the README on disabling it).
# `cname` is still read by Upptime for the links it writes (README summary, repository homepage).
skipGeneratingWebsite: true

status-website:
  cname: status.treeprep.com
